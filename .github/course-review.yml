version: 1

course:
  name: 数据结构
  timezone: Asia/Shanghai
  title_template: "[{student_id}{student_name}]{assignment_id}作业提交"
  submission_path_template: "{student_id}{student_name}/{assignment_id}"
  merge_method: merge

features:
  auto_merge: true
  comment_review: true
  close_late_pr: true
  ai_review: true
  ocr_review: false
  vision_review: true
  metrics: true

defaults:
  min_nonempty_lines: 10
  allow_extra_files: false
  late_close_after_days: 7

ai:
  model: glm-4.7-flash
  min_confidence: 0.8
  timeout_seconds: 60
  max_attempts: 5
  max_file_bytes: 200000
  max_total_bytes: 500000
  max_output_tokens: 2048

ocr:
  detection_model: PP-OCRv6_small_det
  recognition_model: PP-OCRv6_small_rec
  min_line_confidence: 0.65
  max_text_chars: 20000

vision:
  model: glm-4.6v-flash
  min_confidence: 0.85
  fail_confidence: 0.9
  timeout_seconds: 90
  max_attempts: 5
  max_images: 6
  max_image_bytes: 5000000
  max_total_bytes: 12000000
  max_pixels: 25000000
  max_side: 4096
  max_output_tokens: 2048

# 发布作业时在这里追加 Lab1、Lab2 等配置。
# required_files 为相对学生作业目录的精确文件名；vision_files 支持 fnmatch 通配符。
assignments:
  Lab1:
    deadline: "2026-09-08T00:00:00+08:00"
    min_nonempty_lines: 4
    allow_extra_files: false
    required_files:
      - helloworld.c
      - Lab1.md
      - imgs/clion-toolchain.png
      - imgs/clion-hello-world.png
    vision_files:
      - imgs/clion-toolchain.png
      - imgs/clion-hello-world.png
    review_points:
      - helloworld.c 必须是能够独立编译的 C 程序，使用 stdio.h、int main(void) 和 printf，只输出一行 Hello, World!，输出末尾包含换行符，并正常返回 0。
      - helloworld.c 不得使用 C++ 的 iostream、cout 或其他与 C 源文件类型不符的内容，也不得保留无关示例代码。
      - clion-toolchain.png 必须清晰显示 CLion 的 Toolchains 设置页面、当前工具链名称，以及已被正确识别且没有红色错误提示的 CMake、Build Tool、C Compiler 和 Debugger。
      - 截图必须能清晰确认 CLion 窗口、项目树中的 helloworld.c、编辑器中的完整 C 源代码、Run 窗口输出 Hello, World!，以及程序以退出码 0 正常结束。
      - 截图必须来自学生本人的电脑环境并使用电脑截图功能；出现手机拍摄造成的反光、摩尔纹、明显倾斜或文字无法辨认时判为不合格。
